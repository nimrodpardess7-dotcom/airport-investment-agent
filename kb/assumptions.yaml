- id: A-20
  statement: An airport is flagged "cargo-heavy" (low confidence) when freighter departures are at least 25% of all departures in the latest full year (TranStats AIRCRAFT_CONFIG).
  value: 0.25
  why: The score uses the Socrata summary, which mixes freighters into departures and seats per departure. At cargo hubs (ANC) that distorts pressure and up-gauging, so it is flagged rather than hidden (decision D1).
  alternatives_considered: Scoring every airport from TranStats passenger-only data (dropped; slower first run and less stable source).
  sensitivity: Recheck the cut in Phase 1 against known cargo hubs (ANC, MEM, SDF) vs passenger airports.
  owner: Nimrod
  last_reviewed: null

- id: A-21
  statement: A label check within 5 points of its bar (percentile points, or utilization percentage points) is reported as a near miss.
  value: 5
  why: A label that would flip with a small change in the data should say so.
  alternatives_considered: No near-miss reporting (hides fragile labels).
  sensitivity: Wider bands report more near misses; the label itself never changes.
  owner: Nimrod
  last_reviewed: null

- id: A-22
  statement: Flag carrier concentration when one airline holds at least 50% of an airport's seats (TranStats, latest full year).
  value: 0.50
  why: Demand that depends on one airline can leave with it. 50% is about the top quarter of airports.
  alternatives_considered: Herfindahl index (harder to explain for one flag).
  sensitivity: null
  owner: Nimrod
  last_reviewed: null

- id: A-23
  statement: Flag "low base" when growth is at or above p90 of peers but the airport had fewer than 250,000 boardings in 2019.
  value: {growth_min_percentile: 90, max_boardings_2019: 250000}
  why: A large percentage on a small base can come from one new airline, not lasting demand.
  alternatives_considered: null
  sensitivity: null
  owner: Nimrod
  last_reviewed: null

- id: A-24
  statement: >-
    Recovery gap (an estimate, not a measurement) = (median recovery vs 2019 of the airport's peer group
    - the airport's recovery) x the airport's 2019 boardings. Zero when the airport recovered at least as
    well as its peers.
  value: null
  why: Gives "how much" demand is missing relative to similar airports, in passengers.
  alternatives_considered: Comparing with the national median (mixes airport sizes).
  sensitivity: Treats peer recovery as what the airport would have done without its constraint; other causes (e.g. weak routes) would also widen the gap.
  owner: Nimrod
  last_reviewed: null

- id: A-25
  statement: Combi aircraft (carrying passengers and cargo) count in the passenger view of route mix.
  value: true
  why: They carry passengers through the terminal.
  alternatives_considered: Excluding them (they are a small share; ANC 2025 had 800 of about 88,000 departures).
  sensitivity: Small.
  owner: Nimrod
