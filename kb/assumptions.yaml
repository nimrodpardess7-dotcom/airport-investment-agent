- id: A-09
  statement: "Hypothesis: up-gauging (% change in seats per departure, latest 12 months vs 2019) >= p75 of peers AND departures change vs 2019 <= p50 of peers signals an airfield constraint."
  value: {upgauging_min_percentile: 75, departures_change_max_percentile: 50}
  why: Airlines up-gauge when they can't add flights.
  alternatives_considered: null
  sensitivity: >-
    Fleet strategy and pilot shortages also drive up-gauging, so it is display-only: shown as a trace,
    never a trigger for the Airfield label. The Phase 1 backtest reports how well it separates known
    constrained airports.
  owner: Nimrod
  last_reviewed: null

- id: A-10
  statement: >-
    Lost arrival capacity = (reference arrival rate - current arrival rate) per hour, from documented sources
    (kb/constraints.yaml), times operating hours per day, shown as an UPPER BOUND. Converted to passengers
    with the airport's average seats per departure x load factor (latest 12 months).
  value: {operating_hours_per_day: 17}
  why: >-
    Investors want a number. 17 hours = 06:00-23:00, the FAA's designated hours for SFO and LAX as
    Level 2 airports. It's an upper bound because it assumes every lost clear-weather slot would be filled
    all day; low-visibility hours and off-peak demand make the real loss smaller.
  alternatives_considered: Per hour only (decision D4); reversed in the review because the register promised an upper bound.
  sensitivity: Linear in hours; 12 peak hours instead of 17 cuts the estimate by about 30%.
  owner: Nimrod
  last_reviewed: null

- id: A-11
  statement: >-
    Flag an airport when ultra-low-cost carriers (Spirit, Frontier, Allegiant, Sun Country, Avelo, Breeze)
    hold at least 25% of its seats (TranStats, latest full year, passenger aircraft).
  value: {threshold: 0.25, carriers: [NK, F9, G4, SY, XP, MX]}
  why: ULCCs run high load factors by design, which inflates the pressure signal. 25% is about p90 of airports.
  alternatives_considered: The narrower list without Avelo and Breeze (misses HVN, which is 100% Avelo).
  sensitivity: Which airlines count as ULCC is itself a judgment.
  owner: Nimrod
  last_reviewed: null

- id: A-12
  statement: The Regulatory label triggers when passengers (A-07) reach 85% of a hard passenger cap. Other caps (daily departures, loading bridges, curfew) are shown as facts and never trigger it.
  value: 0.85
  why: Judgment. Only a passenger cap directly limits terminal payback.
  alternatives_considered: null
  sensitivity: null
  owner: Nimrod
  last_reviewed: null

- id: A-13
  statement: The Terminal label needs Growth and Pressure both >= p60 of peers.
  value: 60
  why: Judgment.
  alternatives_considered: null
  sensitivity: Recheck against the real distribution in Phase 1.
  owner: Nimrod
  last_reviewed: null

- id: A-14
  statement: The Airfield label triggers when the NAS (runway/ATC) delay share is >= p75 of peers, or a runway-geometry fact exists in constraints.yaml.
  value: 75
  why: NAS share is measured evidence that the airfield causes delays. It catches the known constrained airports (SFO, LGA, EWR, DCA, BOS, JFK, ORD).
  alternatives_considered: >-
    Departures per effective runway >= p75 OR NAS share (fired for 161 of 399 airports, too broad);
    both must agree (30 airports, missed BOS, DCA, JFK, ORD). Departures per runway is now display-only.
  sensitivity: Only reporting airlines file delay causes, so small airports can be Airfield only through a geometry fact.
  owner: Nimrod
  last_reviewed: null

- id: A-15
  statement: Effective runway = open (not marked closed in OurAirports) AND at least the minimum length in config. One OurAirports row = one runway.
  value: {min_length_ft: 5000}
  why: Excludes closed and general-aviation-only strips; SNA's 5,700 ft runway must still count.
  alternatives_considered: Raw runway count (misleading; SNA has a 2,887 ft GA-only runway).
  sensitivity: The count stays crude on purpose. Crossing or close-parallel geometry (SFO) is handled by a constraints.yaml entry, which fires the Airfield label directly.
  owner: Nimrod
  last_reviewed: null

- id: A-16
  statement: T-100 segment passengers at origin are a proxy for enplanements.
  value: null
  why: It's the only monthly public source covering every airport.
  alternatives_considered: FAA CY enplanement reports (annual only, published late).
  sensitivity: Segment data also counts through-passengers who stay on board, so it slightly overstates enplanements. Same bias for every airport, so the ranking holds.
  owner: Nimrod
  last_reviewed: null

