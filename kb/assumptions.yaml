# Judgment calls. Cite as [assumption: A-xx]. Edit freely; every change is versioned in git.
# Fields: id, statement, value, why, alternatives_considered, sensitivity, owner, last_reviewed
# null = not yet filled in (Phase 0/1).

- id: A-01
  statement: Opportunity score weights are Growth 0.35, Capacity Pressure 0.35, Scale 0.30.
  value: {growth: 0.35, pressure: 0.35, scale: 0.30}
  why: Growth and pressure are the thesis. Scale matters because payback is per passenger, but size alone isn't opportunity.
  alternatives_considered: "Pressure lens: scale 0, growth 0.5, pressure 0.5."
  sensitivity: null
  owner: Nimrod
  last_reviewed: null

- id: A-02
  statement: Peer groups are FAA hub classes, computed from each airport's share of national enplanements (49 U.S.C. 47102, verified). Applied after A-03.
  value: {large: 0.01, medium: 0.0025, small: 0.0005, borderline_margin: 0.10}
  why: Comparing BOS to Burlington is meaningless.
  alternatives_considered: Using the FAA's official published hub list instead of computing from T-100.
  sensitivity: Computed from T-100 (A-16), so an airport near a cutoff may land one class off from the FAA's official list. Airports within the borderline margin get a "borderline class" note.
  owner: Nimrod
  last_reviewed: null

- id: A-03
  statement: The universe is FAA primary airports (more than 10,000 enplanements per year). Applied first.
  value: 10000
  why: Below that, data is noise. This is the same line as the FAA's non-hub floor, so A-02 and A-03 don't conflict.
  alternatives_considered: null
  sensitivity: null
  owner: Nimrod
  last_reviewed: null

- id: A-04
  statement: Growth is latest 12 months vs 2019, plus CAGR from 2022 to latest.
  value: {baseline_year: 2019, cagr_start_year: 2022}
  why: A plain 3-5 year CAGR is distorted by COVID.
  alternatives_considered: Plain 3-5 year CAGR.
  sensitivity: null
  owner: Nimrod
  last_reviewed: null

- id: A-05
  statement: Long-haul means a great-circle distance over 4,000 km (Eurocontrol).
  value: 4000
  why: No single industry standard exists; this one is citable.
  alternatives_considered: EU 3,500 km, shown as a sensitivity check.
  sensitivity: Long-haul share at 3,500 km is reported alongside.
  owner: Nimrod
  last_reviewed: null

- id: A-06
  statement: >-
    Route mix counts passenger aircraft only by default; cargo is shown separately. The split comes from
    TranStats AIRCRAFT_CONFIG (filed by the airline), so it is exact for any month, season or year.
    OpenSky "last 7 days" answers report all flights only, with no passenger/cargo split.
  value: {include_cargo_default: false}
  why: The client invests in passenger terminals. ANC cargo would distort the answer.
  alternatives_considered: >-
    Guessing cargo from callsign prefixes (dropped in Phase 0, decision D2). It missed about half of ANC
    freighter departures, and a carrier like Cathay flies only freighters at ANC but passengers at SFO,
    so no single list works for every airport.
  sensitivity: null
  owner: Nimrod
  last_reviewed: null

- id: A-07
  statement: Total passengers are approximately enplanements x 2.
  value: 2
  why: Legal caps count everyone passing through; T-100 counts only boarding passengers.
  alternatives_considered: null
  sensitivity: null
  owner: Nimrod
  last_reviewed: null

- id: A-08
  statement: '"LA" means LAX; "Santa Ana" means SNA (John Wayne).'
  value: {LA: LAX, Santa Ana: SNA}
  why: SNA's code belongs to Santa Ana.
  alternatives_considered: The agent offers to add BUR, LGB and ONT.
  sensitivity: null
  owner: Nimrod
  last_reviewed: null

- id: A-09
  statement: "Hypothesis: up-gauging (% change in seats per departure, latest 12 months vs 2019) >= p75 of peers AND departures change vs 2019 <= p50 of peers signals an airfield constraint."
  value: {upgauging_min_percentile: 75, departures_change_max_percentile: 50}
  why: Airlines up-gauge when they can't add flights.
  alternatives_considered: null
  sensitivity: >-
    Fleet strategy and pilot shortages also drive up-gauging, so it is display-only: shown as a trace,
    never a trigger for the Airfield label. The Phase 1 backtest reports how well it separates known
    constrained airports.
  owner: Nimrod
  last_reviewed: null

- id: A-10
  statement: >-
    Lost arrival capacity = reference arrival rate - current arrival rate, per hour, both from documented
    sources (kb/constraints.yaml). The live FAA rate is shown alongside when FAA lists the airport.
  value: {unit: arrivals_per_hour}
  why: Investors want a number. Per hour needs no guess about operating hours (decision D4).
  alternatives_considered: Multiplying by operating hours for a daily figure (dropped; needs an extra, hard-to-defend guess).
  sensitivity: Clear-weather rates only; low-visibility rates are lower.
  owner: Nimrod
  last_reviewed: null

- id: A-11
  statement: ULCC flag threshold, as a share of seats.
  value: null   # set in Phase 1
  why: ULCCs run high load factors by design, which inflates the pressure signal.
  alternatives_considered: null
  sensitivity: null
  owner: Nimrod
  last_reviewed: null

- id: A-12
  statement: The Regulatory label triggers when passengers (A-07) reach 85% of a hard passenger cap. Other caps (daily departures, loading bridges, curfew) are shown as facts and never trigger it.
  value: 0.85
  why: Judgment. Only a passenger cap directly limits terminal payback.
  alternatives_considered: null
  sensitivity: null
  owner: Nimrod
  last_reviewed: null

- id: A-13
  statement: The Terminal label needs Growth and Pressure both >= p60 of peers.
  value: 60
  why: Judgment.
  alternatives_considered: null
  sensitivity: Recheck against the real distribution in Phase 1.
  owner: Nimrod
  last_reviewed: null

- id: A-14
  statement: The Airfield label triggers when the NAS (runway/ATC) delay share is >= p75 of peers, or a runway-geometry fact exists in constraints.yaml.
  value: 75
  why: NAS share is measured evidence that the airfield causes delays. It catches the known constrained airports (SFO, LGA, EWR, DCA, BOS, JFK, ORD).
  alternatives_considered: >-
    Departures per effective runway >= p75 OR NAS share (fired for 161 of 399 airports, too broad);
    both must agree (30 airports, missed BOS, DCA, JFK, ORD). Departures per runway is now display-only.
  sensitivity: Only reporting airlines file delay causes, so small airports can be Airfield only through a geometry fact.
  owner: Nimrod
  last_reviewed: null

- id: A-15
  statement: Effective runway = open (not marked closed in OurAirports) AND at least the minimum length in config. One OurAirports row = one runway.
  value: {min_length_ft: 5000}
  why: Excludes closed and general-aviation-only strips; SNA's 5,700 ft runway must still count.
  alternatives_considered: Raw runway count (misleading; SNA has a 2,887 ft GA-only runway).
  sensitivity: The count stays crude on purpose. Crossing or close-parallel geometry (SFO) is handled by a constraints.yaml entry, which fires the Airfield label directly.
  owner: Nimrod
  last_reviewed: null

- id: A-16
  statement: T-100 segment passengers at origin are a proxy for enplanements.
  value: null
  why: It's the only monthly public source covering every airport.
  alternatives_considered: FAA CY enplanement reports (annual only, published late).
  sensitivity: Segment data also counts through-passengers who stay on board, so it slightly overstates enplanements. Same bias for every airport, so the ranking holds.
  owner: Nimrod
  last_reviewed: null

- id: A-17
  statement: Ambiguous names ("Portland", "Washington", ...) trigger a clarifying question, never a guess.
  value: {Portland: [PWM, PDX], Washington: [DCA, IAD, BWI]}
  why: PWM vs PDX; DCA vs IAD vs BWI.
  alternatives_considered: null
  sensitivity: null
  owner: Nimrod
  last_reviewed: null

- id: A-18
  statement: Highly seasonal = busiest month / quietest month >= 2.0, over the latest 12 months.
  value: 2.0
  why: Simple to explain.
  alternatives_considered: null
  sensitivity: Recheck in Phase 1 against known seasonal airports (ACK, MVY) vs year-round ones.
  owner: Nimrod
  last_reviewed: null

- id: A-19
  statement: If any required 12-month window is missing 1 or more months, flag low confidence. If it's missing more than 3 months, don't compute that component; show it as n/a.
  value: {low_confidence_if_missing_months: 1, skip_component_if_missing_months: 4}
  why: A partial year biases both growth and load factor.
  alternatives_considered: null
  sensitivity: null
  owner: Nimrod
  last_reviewed: null

- id: A-20
  statement: An airport is flagged "cargo-heavy" (low confidence) when freighter departures are at least 25% of all departures in the latest full year (TranStats AIRCRAFT_CONFIG).
  value: 0.25
  why: The score uses the Socrata summary, which mixes freighters into departures and seats per departure. At cargo hubs (ANC) that distorts pressure and up-gauging, so it is flagged rather than hidden (decision D1).
  alternatives_considered: Scoring every airport from TranStats passenger-only data (dropped; slower first run and less stable source).
  sensitivity: Recheck the cut in Phase 1 against known cargo hubs (ANC, MEM, SDF) vs passenger airports.
  owner: Nimrod
  last_reviewed: null
