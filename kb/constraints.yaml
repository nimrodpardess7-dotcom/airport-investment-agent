# Facts about airports. Cite as [domain: id]. Every entry needs a source before submission.
# Fields: id, airport, type (cap | curfew | runway | schedule-level), statement, value, source_url, verified_on, confidence
# A runway entry whose value has `geometry` set fires the Airfield label directly (PLAN 3, A-15).
# Only a cap entry with value.annual_passengers and hard: true can fire the Regulatory label (A-12).
# confidence: verified (official source) | medium (press / secondary) | unverified (seed, no source yet)

- id: SNA-01
  airport: SNA
  type: cap
  statement: >-
    The 1985 Settlement Agreement (as amended in 2014) caps John Wayne Airport at 12.2 million annual passengers
    from Jan 1, 2026 through Dec 31, 2030, or 12.5 million if 11.21 MAP was served in 2021-2025 and certain
    mitigation measures are met. Which of the two applies is not confirmed in a public source; it was 11.8 MAP
    through 2025. The Regulatory label uses the lower figure; it fires under either.
  value: {annual_passengers: 12200000, annual_passengers_alt: 12500000, hard: true, expires: 2030}
  source_url: https://www.ocair.com/about/administration/settlement-agreement/key-provisions-settlement-agreement/
  verified_on: 2026-10-16
  confidence: verified   # framework verified; which tier applies in 2026 is unconfirmed

- id: SNA-02
  airport: SNA
  type: cap
  statement: >-
    Maximum of 95 Class A (loudest) average daily departures for passenger service through Dec 31, 2030.
    Passenger loading bridges have no limit through 2030. Shown as facts; they do not fire the Regulatory label.
  value: {class_a_average_daily_departures: 95, loading_bridges: null, expires: 2030}
  source_url: https://www.ocair.com/about/administration/settlement-agreement/key-provisions-settlement-agreement/
  verified_on: 2026-10-16
  confidence: verified

