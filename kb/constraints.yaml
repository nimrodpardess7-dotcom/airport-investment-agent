- id: LAX-01
  airport: LAX
  type: cap
  statement: >-
    78.9 million annual passengers was the LAX Master Plan's demand forecast, not a legal cap. Airport officials
    state there is no hard passenger or flight cap; LAX passed 78.9M in 2016 and handled about 73.7M in 2025.
    The LAX Specific Plan (adopted 2005, last amended 2017) was not checked for a current numeric limit.
  value: {annual_passengers: 78900000, hard: false}
  source_url: https://www.lawa.org/sites/lawa/files/2026-06/2025%20Aviation%20Activity%20Analysis_Final.pdf
  verified_on: 2026-10-16
  confidence: medium

- id: SFO-01
  airport: SFO
  type: runway
  statement: >-
    The two pairs of parallel runways are 750 ft apart, too close for independent approaches. In low visibility
    arrivals go single-file (about 30 per hour, unverified).
  value: {geometry: close_parallel, runway_spacing_ft: 750, arrivals_per_hour_ifr: 30}
  source_url: https://www.kqed.org/news/12078501/sfo-flight-delays-2026-runway-closure-faa-san-francisco-international-aiport-tsa
  verified_on: 2026-10-16
  confidence: medium   # spacing well documented; IFR rate still unverified

- id: SFO-02
  airport: SFO
  type: runway
  statement: >-
    Since March 31, 2026 the FAA no longer allows side-by-side landings at SFO, even in clear weather.
    Clear-weather arrival capacity fell from 54 to 36 per hour (also reduced by runway repaving). Staggered
    approaches raised it to 40 per hour from Aug 12, 2026, with 42 planned by the end of August. Not a full restoration.
  # reference/current feed A-10 (capacity loss per hour); the other rates are context.
  value: {reference_arrival_rate: 54, current_arrival_rate: 40, current_since: "2026-08-12",
          low_arrival_rate: 36, planned_arrival_rate: 42}
  source_url: https://deeparrival.com/news/faa-sfo-arrival-rate-increase-staggered-approaches-august-12-2026/
  verified_on: 2026-10-16
  confidence: medium   # press reports of an FAA email; live FAA feed shows SFO's rate only when SFO has an active event

- id: SFO-03
  airport: SFO
  type: schedule-level
  statement: >-
    SFO is an FAA-designated IATA Level 2 (schedule-facilitated) airport since Summer 2012, citing runway
    capacity and delays; still listed for Summer 2027 (designated hours 06:00-23:00 Pacific). Airlines'
    schedules are reviewed on a voluntary basis.
  value: {iata_level: 2, since: 2012}
  source_url: https://public-inspection.federalregister.gov/2026-20784.pdf
