# Weights, thresholds and parameters. Every judgment value carries its A-ID from kb/assumptions.yaml.
# See docs/PLAN.md section 3.

scoring:
  lenses:
    absolute:            # A-01
      growth: 0.35
      pressure: 0.35
      scale: 0.30
    pressure:            # A-01 (alternative lens)
      growth: 0.5
      pressure: 0.5
      scale: 0.0
  default_lens: absolute
  windows:               # A-04: latest 12 published months (rolling) vs calendar years
    baseline_year: 2019
    cagr_start_year: 2022

constraint_label:
  regulatory_utilization: 0.85      # A-12: passengers (A-07) / hard passenger cap
  airfield_percentile: 75           # A-14: NAS delay share percentile, within peer group
  terminal_percentile: 60           # A-13: growth AND pressure, within peer group
  upgauging_signature:              # A-09 hypothesis: display-only, never triggers the label
    in_label: false
    upgauging_min_percentile: 75
    departures_change_max_percentile: 50

runways:
  effective_min_length_ft: 5000     # A-15: open AND at least this long

flags:
  ulcc_share_threshold: null        # A-11: set in Phase 1 (airport x carrier seats from TranStats)
  seasonality_ratio_threshold: 2.0  # A-18: busiest month / quietest month, latest 12 months
  cargo_heavy_freighter_share: 0.25 # A-20: freighter departures / all departures, latest full year (TranStats)
  completeness:                     # A-19
    low_confidence_if_missing_months: 1
    skip_component_if_missing_months: 4

peer_groups:                        # A-02: share of national enplanements (49 U.S.C. 47102)
  large: 0.01
  medium: 0.0025
  small: 0.0005
  borderline_margin: 0.10           # A-02: within +/-10% of a cutoff -> "borderline class" note
universe_min_enplanements: 10000    # A-03: applied before A-02

regions:
  new_england: [CT, ME, MA, NH, RI, VT]

route_mix:
  long_haul_km: 4000                # A-05 (Eurocontrol)
  long_haul_km_sensitivity: 3500    # A-05 alternative (EU)
  include_cargo_default: false      # A-06: passenger vs cargo split from TranStats AIRCRAFT_CONFIG (D2)

aliases:                            # A-08
  LA: LAX
  Santa Ana: SNA
ambiguous_names:                    # A-17: always ask, never guess
  Portland: [PWM, PDX]
  Washington: [DCA, IAD, BWI]

passengers_per_enplanement: 2       # A-07

sources:
  bts_t100_dataset: r495-tyji
  bts_base_url: https://data.bts.gov/resource
  faa_nas_base_url: https://nasstatus.faa.gov
  transtats_t100_form: https://www.transtats.bts.gov/DL_SelectFields.aspx?gnoyr_VQ=FMG&QO_fu146_anzr=Nv4%20Pn44vr4
  transtats_delay_causes_form: https://www.transtats.bts.gov/OT_Delay/OT_DelayCause1.asp?20=E
  opensky_window_days: 7            # "last 7 days" questions
  opensky_max_request_days: 2       # API limit per request; the window is fetched in chunks

# Cache TTLs are engineering choices (freshness vs speed), not judgment calls, so no A-ID.
cache:
  dir: .cache
  ttl_seconds:
    bts_t100: 86400
    ourairports: 604800
    opensky: 21600
    faa_nas_status: 60
    transtats_t100: 86400
    transtats_delay_causes: 86400

llm:
  model: claude-opus-5-5
  effort: medium                    # routing questions to tools needs little reasoning; keeps answers fast
  max_tool_rounds: 8                # safety stop for the tool loop
